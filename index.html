<meta charset="utf-8">
<title>Animalgeddon Home Base</title>
<style>
@font-face{font-family:"Atkinson";src:url(assets/fonts/Atkinson.ttf) format("truetype");font-weight:400}
@font-face{font-family:"Atkinson";src:url(assets/fonts/Atkinson-Bold.ttf) format("truetype");font-weight:700}
@font-face{font-family:"Press Start 2P";src:url(assets/fonts/PressStart2P.ttf) format("truetype")}
/* Style guide: design/STYLE.md. Wood, rope and parchment; icons + numbers; one amber accent. */
:root{
  --bg:#101710; --wood:#9a5a2c; --wood-dark:#5a2e14; --wood-deep:#2b1a0e; --line:#5a2e14;
  --fg:#f6e9cf; --cream:#f6e9cf; --dim:#dcbd8f; --ink:#3a2314;
  --green:#8fd45c; --amber:#f0b64a; --red:#ff7a6a; --sky:#7ad0e0;
  --display:"Press Start 2P", ui-monospace, monospace;
  --body:"Atkinson", "Trebuchet MS", sans-serif;
  --parch:#efdcb4; --parch2:#e6cf9f; --ink:#3a2314; --ink-dim:#7a5a38; --ink-amber:#9a5212; --ink-good:#2f7a1e; --ink-bad:#b3261e; --ink-cold:#1d6f8a;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;line-height:1.2;margin:0;overflow:hidden}
[hidden]{display:none!important}
.setrow.locked{opacity:.55}.setrow.got b{color:var(--ink-amber)}
input.rename{font:700 20px var(--body);padding:6px 10px;border:3px solid #7a4a24;background:#fff8e6;color:var(--ink);width:100%;box-sizing:border-box}
.rn .ed,.pchip .ed{opacity:.55;cursor:pointer;margin-left:2px}.rn .ed:hover,.pchip .ed:hover{opacity:1}
.tt{position:fixed;z-index:50;pointer-events:none;background:var(--parch);color:var(--ink);border:3px solid #7a4a24;box-shadow:3px 3px 0 rgba(0,0,0,.5);padding:4px 9px;font:15px var(--body);max-width:300px;line-height:1.3}
.roster{margin-top:6px;display:flex;flex-direction:column;gap:3px}.rrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 6px;background:rgba(120,80,40,.10);border:1px solid rgba(120,80,40,.3)}.rrow .rn{flex:1 1 150px}.rrow .btn.sm,.rrow button{font-size:13px}
.px,.ic,.asp,.sp{image-rendering:pixelated}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-inline:14px;padding-block:0 8px;gap:8px;box-sizing:border-box}
/* HUD: one dark wood strip, icons + numbers */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:linear-gradient(#2b1a0e,#1b1109);border-bottom:4px solid #4a2a14;padding:6px 12px;margin-inline:-14px;padding-inline:18px}
.hud .title{font-family:var(--display);font-size:12px;color:var(--amber);letter-spacing:1px;margin-right:6px;text-shadow:2px 2px 0 #000}
.hud .day{font-size:22px;font-weight:700;color:var(--cream);text-shadow:1px 1px 0 #000}
.hud .season{font-size:19px;color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.hud .hour{font-size:23px;font-weight:700;min-width:5ch;text-shadow:1px 1px 0 #000}
.hud .sky{width:100px;height:8px;border:2px solid #4a2a14;position:relative;background:linear-gradient(90deg,#1a2240 0 25%,#f0b64a 33%,#9fe0ff 50%,#f0b64a 70%,#1a2240 80%)}
.hud .sky i{position:absolute;top:-3px;width:4px;height:12px;background:#fff}
.hud .spd{display:flex;gap:3px}
.hud .res{display:flex;flex-wrap:wrap;gap:2px 8px;margin-left:auto}
.hud .battle{font-family:var(--display);font-size:9px;color:var(--red);animation:blink 1s steps(2) infinite;display:inline-flex;align-items:center;gap:6px}
@keyframes blink{50%{opacity:.3}}
.chip{display:inline-flex;gap:4px;align-items:center;font-size:21px;font-weight:600;white-space:nowrap;text-shadow:1px 1px 0 #000;padding:1px 2px}
.chip small{color:var(--dim);font-size:14px;font-weight:400}
.chip.bad{color:#ff8a7a} .chip.warn{color:var(--amber)}
/* icons (Franuka atlas) and animal icons (Riclmbr) */
.ic{display:inline-block;width:32px;height:32px;background-image:url(icons.png);background-repeat:no-repeat;vertical-align:middle;flex:0 0 auto}
.ic.s{width:24px;height:24px}
.asp{display:inline-block;width:40px;height:40px;background-image:url(animals.png);background-repeat:no-repeat;vertical-align:middle;flex:0 0 auto}
.sp{display:inline-block;width:32px;height:32px;background-image:url(sheet.png);background-repeat:no-repeat;vertical-align:middle}
.psp{display:inline-block;position:relative;vertical-align:middle;image-rendering:pixelated}.psp i{position:absolute;left:0;top:0;width:100%;height:100%;background-image:url(people.png);background-repeat:no-repeat}
.bsp{display:inline-block;background-image:url(bld.png);background-repeat:no-repeat;vertical-align:middle;image-rendering:pixelated}
/* stage */
.main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b100a;border:4px solid #2a1a0e;box-shadow:0 0 0 2px #0a0f0a;overflow:hidden}
canvas#map{image-rendering:pixelated;display:block;max-width:100%;max-height:100%;cursor:pointer;touch-action:none}
.tut{position:absolute;left:10px;top:10px;max-width:360px;background:var(--parch);color:var(--ink);border:3px solid #7a4a24;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:8px 12px;font-size:16px;line-height:1.35;z-index:3}.tut b{display:block;color:var(--ink-amber);letter-spacing:1px;font-size:13px;margin-bottom:2px}.tut .tb{display:flex;gap:8px;margin-top:6px;align-items:center}.tut button{font:700 14px var(--body);background:#7a4a24;color:#f6e9cf;border:0;padding:3px 10px;cursor:pointer}.tut .done{color:var(--ink-good);font-weight:700}
.advisor{position:absolute;left:10px;right:10px;bottom:10px;border:3px solid #7a4a24;background:rgba(27,17,9,.92);padding:7px 12px;display:flex;gap:10px;align-items:center;pointer-events:none;font-size:19px}
.advisor b{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:1px;color:var(--amber);white-space:nowrap}
.advisor.fight{border-color:#b33a2c;background:rgba(42,14,10,.94)} .advisor.fight b{color:#ff8a7a}
.tip{position:absolute;left:10px;top:10px;color:var(--dim);background:rgba(11,16,10,.8);border:2px solid rgba(90,46,20,.8);padding:2px 8px;font-size:16px;pointer-events:none;max-width:70%}
/* modals: nailed board; story and events on parchment */
.modal{position:absolute;inset:0;background:rgba(5,8,5,.62);}.modal.titlemode{background:rgba(5,8,5,.18);justify-content:flex-end;padding-right:36px}.modal{display:flex;align-items:center;justify-content:center;padding:16px;z-index:4}
.modal .box{border:28px solid transparent;border-image:url(assets/toffeecraft-ui/panel_big.png) 14 fill stretch;image-rendering:pixelated;max-width:470px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:hidden;box-sizing:border-box;color:var(--ink);position:relative;z-index:0;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.5))}
.modal .box>*{min-height:0;flex:0 1 auto}.modal .box>p,.modal .box>.menu,.modal .box>.sets,.modal .box>.story{overflow-y:auto;overflow-x:hidden;scrollbar-color:#a07a50 transparent;scrollbar-width:thin;margin:0}.modal .box>.row{flex:0 0 auto}
.modal .box::before{content:'';position:absolute;inset:-8px;background:var(--parch);z-index:-1}
.modal .box.wide{max-width:680px}
.modal .box.bad{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(255,80,60,.5))}
.modal .box.good{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(143,212,92,.45))}
.modal .box.scroll{border-image:url(assets/toffeecraft-ui/scroll.png) 30 fill stretch;border-width:40px 30px}
.modal .box.scroll::before{display:none}
.modal h3{font-family:var(--body);font-size:21px;font-weight:700;margin:0;line-height:1.3;display:flex;align-items:center;gap:8px;letter-spacing:.3px;color:var(--ink)}
.modal p{margin:0}
.titlecard{text-align:center}
.titlecard h1{font-family:var(--display);font-size:22px;color:var(--ink-amber);margin:6px 0 4px;text-shadow:3px 3px 0 rgba(90,46,20,.35);letter-spacing:2px}
.titlecard .tag{color:var(--ink-dim);margin:0 0 8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;text-align:left}
.mode{border:16px solid transparent;border-image:url(assets/toffeecraft-ui/tab.png) 8 fill stretch;image-rendering:pixelated;cursor:pointer;display:flex;flex-direction:column;gap:4px;margin:-6px -4px}
.mode:hover,.mode.sel{filter:brightness(1.18)}
.mode b{font-size:16px;font-weight:700;color:var(--cream);display:flex;align-items:center;gap:4px;white-space:nowrap;text-shadow:1px 1px 0 #3a1c08}
.mode small{color:#f1dcb0;font-size:13px;line-height:1.2;text-shadow:1px 1px 0 #3a1c08}
/* drawer: plank panel */
.drawer{width:min(420px,100vw - 28px);height:100%;max-height:100%;overflow:hidden;border:20px solid transparent;border-image:url(assets/toffeecraft-ui/panel.png) 10 fill round;image-rendering:pixelated;display:flex;flex-direction:column;min-height:0;box-sizing:border-box;color:var(--ink);position:relative;z-index:0}
.drawer::before{content:'';position:absolute;inset:-6px;background:var(--parch);z-index:-1}
.drawer .head{display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px;border-bottom:2px solid rgba(120,80,40,.45);flex:0 0 auto;margin:-6px 0 0}
.drawer .head h2{font-family:var(--body);font-size:21px;font-weight:700;margin:0;color:var(--ink);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.drawer .body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 2px 4px;display:flex;flex-direction:column;gap:8px;min-height:0;justify-content:flex-start;scrollbar-color:#a07a50 transparent;scrollbar-width:thin}
.drawer .body>*{flex:0 0 auto}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr)}
  .drawer{position:fixed;left:14px;right:14px;top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:55vh;max-height:55vh;width:auto;z-index:6}
}
/* bottom tabs: nailed plank boards */
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .btn{min-width:104px;text-align:center;align-items:center;flex-direction:column;gap:0;font-size:15px;letter-spacing:.5px;border-image:url(assets/toffeecraft-ui/tab.png) 8 fill stretch;border-width:14px;min-height:50px;text-transform:uppercase}
.bar .btn .n{display:block;font-family:var(--body);font-size:13px;color:var(--dim);margin-top:0;text-transform:none;letter-spacing:0;font-weight:400}
.bar .btn.alert .n{color:#ffb3a7}
/* buttons: blank wooden plank, 9-slice */
button.btn{font-family:var(--body);font-weight:700;font-size:16px;line-height:1.15;padding:0 4px;border:10px solid transparent;border-image:url(assets/toffeecraft-ui/btn.png) 6 fill stretch;image-rendering:pixelated;background:none;color:var(--cream);text-shadow:1px 1px 0 #3a1c08;cursor:pointer;text-align:left;display:inline-flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;min-height:0;box-sizing:border-box}
button.btn:hover:not(:disabled){filter:brightness(1.15)}
button.btn:active:not(:disabled){border-image-source:url(assets/toffeecraft-ui/btn_pressed.png);transform:translateY(1px)}
button.btn:disabled{opacity:.45;cursor:default;filter:saturate(.6)}
button.btn.sel{filter:brightness(1.22) saturate(1.15);color:#fff4d6}
button.btn.go{filter:brightness(1.25) saturate(1.3)}
button.btn.done{opacity:.6;filter:saturate(.3)}
button.btn.sm{border-width:8px;font-size:15px;padding:0 3px}
button.btn small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:#f1dcb0;text-shadow:1px 1px 0 #3a1c08}
button.chip2{font-family:var(--body);font-size:14px;font-weight:700;padding:2px 8px;background:rgba(120,80,40,.18);color:var(--ink);border:2px solid #a07a50;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
button.chip2:hover:not(:disabled){border-color:var(--ink-amber);color:var(--ink-amber)}
button.chip2:disabled{opacity:.5;cursor:default}
button.chip2.sel{border-color:var(--ink-good);color:var(--ink-good);background:rgba(90,170,60,.15)}
button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
/* cards and lists */
.card,.job,.item,.setrow{background:rgba(120,80,40,.13);border:2px solid rgba(120,80,40,.45);padding:7px 9px;display:flex;flex-direction:column;gap:6px}
.card .t,.job .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .t b{font-weight:700;color:var(--ink-amber)}
.job .t b{font-weight:700;display:flex;align-items:center;gap:8px}
.job .t span{font-size:15px;color:var(--ink-amber);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.job small{color:var(--ink-dim);font-size:14px}
.job.front{border-color:#c2493a} .job.focus{border-color:var(--ink-good)} .job.over{border-color:var(--ink-amber);background:rgba(200,120,30,.2)}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.drawer .muted,.modal .muted{color:var(--ink-dim)} .drawer .warn,.modal .warn{color:var(--ink-amber)} .drawer .bad,.modal .bad{color:var(--ink-bad)} .drawer .good,.modal .good{color:var(--ink-good)} .drawer .cold,.modal .cold{color:var(--ink-cold)}
.muted{color:var(--dim)} .warn{color:var(--amber)} .bad{color:var(--red)} .good{color:var(--green)} .cold{color:var(--sky)}
table{border-collapse:collapse;width:100%;font-size:17px;font-variant-numeric:tabular-nums}
th{font-family:var(--body);font-size:12px;color:var(--ink-amber);text-align:left;padding:4px 5px;border-bottom:2px solid rgba(120,80,40,.5);font-weight:700;letter-spacing:1px;text-transform:uppercase}
td{padding:4px 5px;border-bottom:1px solid rgba(120,80,40,.35);vertical-align:middle}
td.n,th.n{text-align:right}
.tbl{overflow-x:auto}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:4px 8px}
.item .em{width:40px;text-align:center;display:flex;align-items:center;justify-content:center}
.item .n{line-height:1.05;min-width:0}
.item .n small{display:block;color:var(--ink-dim);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;gap:3px;align-items:center;font-size:14px;color:var(--ink-dim)}
.stat i{width:6px;height:9px;background:rgba(120,80,40,.3);display:block}
.stat i.on{background:#c8781a} .stat i.xp{background:#e0b070}
.col{min-height:38px}
.pchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--body);font-size:15px;padding:1px 6px 1px 2px;background:rgba(120,80,40,.18);color:var(--ink);border:2px solid #a07a50;cursor:grab;user-select:none}
.pchip.sel{border-color:var(--ink-good)} .pchip:active{cursor:grabbing}
.slots{display:flex;flex-wrap:wrap;gap:4px}
.slot{width:46px;height:46px;border:2px dashed #a07a50;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(120,80,40,.15)}
.slot.full{border-style:solid} .slot:hover{border-color:var(--ink-amber)} .slot.sel{border-color:var(--ink-good)}
.bar2{height:14px;background:#d8c096;border:2px solid #a07a50;position:relative;min-width:50px}
.bar2 i{position:absolute;inset:1px;right:auto;background:#2c8fb0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.bar2.hp i{background:#5aa63a} .bar2.hp.low i{background:#d6402f}
.log{display:flex;flex-direction:column;gap:3px;font-size:17px}
.log p{margin:0}
.log .g{color:var(--ink-good)} .log .e{color:var(--ink-bad)} .log .s{color:var(--ink-amber)} .log .d{color:var(--ink-dim)}
h4{font-family:var(--body);font-size:13px;color:var(--ink-amber);margin:6px 0 0;letter-spacing:2px;font-weight:700;text-transform:uppercase}
details{color:var(--ink-dim)} summary{cursor:pointer;color:var(--ink)} details ul{margin:6px 0 0;padding-left:18px}
.menu{display:flex;flex-direction:column;gap:6px}
.setrow{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
.setrow small{color:var(--ink-dim);display:block;font-size:14px}
.modal .box a{color:#1d4f8a}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="app">
  <div class="hud">
    <span class="title">ANIMALGEDDON</span>
    <span class="day">DAY <span id="day">1</span></span>
    <span class="season" id="season"></span>
    <span class="hour" id="hour">06:00</span>
    <span class="sky"><i id="sun"></i></span>
    <span class="spd">
      <button class="btn sm" id="sp0" title="Pause (space)">II</button>
      <button class="btn sm" id="sp1" title="Normal (1)">▶</button>
      <button class="btn sm" id="sp2" title="Fast (2)">▶▶</button>
      <button class="btn sm" id="sp4" title="Fastest (3)">▶▶▶</button>
      <button class="btn sm" id="mute" title="Sound (M)"></button>
      <button class="btn sm" id="menuBtn" title="Menu (Esc)">MENU</button>
    </span>
    <span class="battle" id="battleFlag" hidden>HORDE AT THE WALL</span>
    <span class="res" id="res"></span>
  </div>

  <div class="main">
    <div class="stage">
      <canvas id="map" width="1024" height="704" aria-label="Home base"></canvas>
      <div class="tip" id="tip"></div>
      <div class="advisor" id="advisor"></div>
      <div class="tut" id="tut" hidden></div>
      <div class="modal" id="modal" hidden></div>
    </div>
    <aside class="drawer" id="drawer" hidden>
      <div class="head"><h2 id="drawerTitle"></h2><button class="btn sm" id="drawerClose">✕</button></div>
      <div class="body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="bar" id="bar"></div>
</div>

<script>
(function(){

const cv=document.getElementById('map'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);

    if(target.hp<=0){kill(target,cname(c));}});
  guardsP.forEach(p=>{const live=B.enemies.filter(e=>!e.dead);if(!live.length)return;const a=anim[p.id];if(!a)return;
    const target=live.sort((u,v)=>Math.hypot(u.x-a.x,u.y-a.y)-Math.hypot(v.x-a.x,v.y-a.y))[0];

  S.creatures.filter(c=>c.hp<=0).forEach(c=>{B.lost.push(cname(c));ticker(`${cname(c)} fell at the ${DIRS[c.front].toLowerCase()} wall`);const a=anim[c.id];if(a){puff(a.x,a.y,'#ff6b5c',6,40);corpse(c.sp,a.x,a.y+8,a.face);}log(`${cname(c)} fell at the ${DIRS[c.front].toLowerCase()} wall.`,'e');sfx('hurt');});

function endBattle(){

function writeReport(R){

/* ---------- advisor ---------- */
function advice(){
  const prod=production(),cons=consumption();const nh=nextHordeDay(),d=defenseParts();
  const gl=daysLeft(S.res.greens,prod.greens-cons.greens);
  if(S.over)return ['OVERRUN','The base fell. Start again from the title screen.'];
  if(S.battle&&!S.battle.enemies.length&&S.battle.wave<S.battle.waves.length)return ['LULL',`Wave ${S.battle.wave} is down. Wave ${S.battle.wave+1} of ${S.battle.waves.length} is forming in the trees: move animals, patch nothing yet.`];
  if(S.battle){const B=S.battle;const weak=B.dirs.filter(dir=>!guardsOf(dir).length);const gap=B.dirs.find(d=>S.walls[d].broken);if(gap)return ['GAP',`The ${DIRS[gap].toLowerCase()} wall has a gap. Your animals there are holding it; drag more in. Builders patch it after the fight.`];
    const cold=S.creatures.filter(c=>c.post==='guard'&&coldFactor(c)<1).length;
    return ['FIGHT',`${B.enemies.length} infected at the ${B.dirs.map(x=>DIRS[x].toLowerCase()).join(' and ')}${weak.length?`. Nothing is defending the ${weak.map(x=>DIRS[x].toLowerCase()).join(' and ')}: drag animals there.`:cold?`. ${cold} cold-blooded animal${cold>1?'s are':' is'} outside the fire's warmth, fighting at half strength.`:'. Your animals are biting over the wall. Drag them between walls if one front is losing.'}`];}
  if(fronts().some(f=>!S.walls[f].lvl&&!queueItem('wall',f)))return ['WALL',`No wall on the ${fronts().filter(f=>!S.walls[f].lvl).map(f=>DIRS[f].toLowerCase()).join(' and ')} front. The wall is the quarantine. Build it before day ${nh}.`];
  if(S.queue.length&&!inJob('builder').length)return ['BUILD','Blueprints are waiting but everyone has a job. Drag someone back to Builder.'];
  if(gl<2)return ['FOOD',`Greens run out in ${gl} day${gl===1?'':'s'}. Add a farmer or upgrade the garden.`];
  for(const f of FOODS){const n=prod[f]-cons[f];if(cons[f]>0&&daysLeft(S.res[f],n)<2)return ['FOOD',`${RESN[f]} run out in ${daysLeft(S.res[f],n)} day(s) and ${EATERS[f]} eat them. ${f==='rodents'?'Build traps and add a trapper.':f==='insects'?'Build an insect hut and add a bug keeper.':'Add a farmer.'}`];}
  if(nh-S.day<=1&&!S.creatures.some(c=>c.post==='guard'))return ['HORDE',`Horde ${nh===S.day?'at dusk':'tomorrow'} and no animals on the walls. Drag some from the pen onto the east wall.`];
  if(isWinter()&&S.creatures.some(c=>c.post==='guard'&&!SPECIES[c.sp].bird)&&!fronts().every(f=>{const s=wallSpot(f,0,1);return warmAt(s.x,s.y);}))return ['COLD','Winter: a front is outside the fire\'s warmth. Reptiles and frogs there fight at half strength. Upgrade the fire or post birds.'];
  if(seasonIdx()===2&&seasonDay()>=7&&!fronts().every(f=>{const s=wallSpot(f,0,1);return warmAt(s.x,s.y);}))return ['WINTER',`Winter in ${SEASON_DAYS-seasonDay()+1} days and the fire's warmth doesn't reach every wall. Upgrade the fire, and stock greens: gardens halve.`];
  if(S.day>=15&&!anyOf('relay')&&!S.contact&&S.res.wood>=18&&S.res.scrap>=18)return ['RADIO','The voice wants a relay. Build the Radio relay (Build panel) and keep it standing on day 30.'];
  if(S.eggs.length&&!inJob('keeper').length&&!(hatch()&&LV(hatch()).auto)&&!hasR('incubators'))return ['EGGS','Eggs won\'t hatch without a keeper at the hatchery.'];
  if(penFull())return ['PENS','The pen is full. Post some animals to a wall, or upgrade the pen, before more eggs are laid or hatched.'];
  if(inJob('scout').length&&!anyGate()&&!S.queue.some(q=>q.kind==='gate'))return ['GATE','Scouts are climbing the wall and bringing back half. Build a gate on a front (click the wall).'];
  if(S.people.length>=beds())return ['BEDS','No spare beds. Survivors won\'t stay and no children will be born until you upgrade the shelter.'];
  if(!S.queue.length&&inJob('builder').length>1&&!wallsNeedRepair().length)return ['IDLE',`${inJob('builder').length} builders with nothing to build. Place blueprints, upgrade something, or move them to gathering jobs.`];
  if(!builtOf('lab').length&&!S.queue.some(q=>q.kind==='tile'&&S.tiles[q.key].type==='lab'))return ['RESEARCH','No lab yet. Research unlocks stronger species and better walls.'];
  return ['STEADY',`${season().em} ${season().n}, day ${seasonDay()} of ${SEASON_DAYS}. Supplies are holding.`];
}

/* ---------- animation targets ---------- */
function tileCenter(key){const [x,y]=key.split(',').map(Number);return {x:x*T+T/2,y:y*T+T/2};}
function wallRect(dir){const op=d=>S.open.includes(d);const w=12;
  const x0=(op('W')?2:5)*T,x1=(op('E')?14:11)*T,y0=(op('N')?2:4)*T,y1=(op('S')?10:8)*T;

let TROPH={};try{TROPH=JSON.parse(localStorage.getItem('animalgeddon-trophies'))||{};}catch(e){}
function checkTrophies(){if(!S||S.over)return;let got=0;for(const t of TROPHIES){if(TROPH[t.id])continue;let ok=false;try{ok=t.ok();}catch(e){}if(ok){TROPH[t.id]={day:S.day,when:Date.now()};got++;log(`Trophy: ${t.n}. ${t.d}`,'g');floater(cv.width/2,60+got*22,`Trophy: ${t.n}`,'#f0b64a');}}
  if(got){sfx('done');try{localStorage.setItem('animalgeddon-trophies',JSON.stringify(TROPH));}catch(e){}}}

function showRename(kind,id){uiModal='rename';S.renaming={kind,id};const m=$('modal');m.hidden=false;m.innerHTML='';const box=el('div','box');

  r.appendChild(btn('Save','',ok,'go'));r.appendChild(btn('Cancel','',()=>{uiModal=null;S.renaming=null;m.hidden=true;render();}));box.appendChild(r);m.appendChild(box);

function showSettings(){
  uiModal='settings';const m=$('modal');m.hidden=false;m.innerHTML='';const box=el('div','box');
  box.innerHTML=`<h3>${ico('settings')}SETTINGS</h3>`;const sets=el('div','sets');box.appendChild(sets);
  const row=(label,sub,ctrl)=>{const r=el('div','setrow');r.appendChild(el('div','',`${label}<small>${sub}</small>`));r.appendChild(ctrl);sets.appendChild(r);};

  row('Sound','everything, effects and music (M)',tog(!muted,v=>{muted=!v;renderHud();updateMusic();}));
  const mv=el('div','row');[[0,'off'],[.25,'25%'],[.5,'50%'],[.75,'75%'],[1,'100%']].forEach(([v,l])=>{const b=el('button','chip2'+(CFG.music===v?' sel':''),l);b.onclick=()=>{CFG.music=v;save();updateMusic();showSettings();};mv.appendChild(b);});
  row('Music volume','title, day, night, horde, and the rest',mv);
  const sv=el('div','row');[[0,'off'],[.5,'50%'],[1,'100%'],[1.5,'150%']].forEach(([v,l])=>{const b=el('button','chip2'+(CFG.sfx===v?' sel':''),l);b.onclick=()=>{CFG.sfx=v;save();sfx('hammer');showSettings();};sv.appendChild(b);});
  row('Effects volume','hammering, bites, alerts, and weather (rain, wind, thunder, crickets, the fire)',sv);

  row('Battle camera','eases in toward the attacked wall during a horde',tog(CFG.zoom,v=>CFG.zoom=v));
  row('World effects','swaying trees, ground detail, night light, weather on the map (off = faster)',tog(CFG.fx,v=>CFG.fx=v));
  row('Tutorial','step-by-step guide on the map; on by default in Easy',tog(S?S.tut.on:CFG.tutorial!==false,v=>{if(S){S.tut.on=v;if(v)S.tut.step=Math.min(S.tut.step,TUTORIAL.length-1);}CFG.tutorial=v;renderTut();}));
  row('Pause when a building finishes','off: a quiet note on the map instead',tog(CFG.finishAlerts,v=>CFG.finishAlerts=v));
  const sel2=el('div','row');[['auto','auto'],['daily','daily'],['weekly','weekly'],['off','bad nights only']].forEach(([v,l])=>{const b=el('button','chip2'+(CFG.summary===v?' sel':''),l);b.onclick=()=>{CFG.summary=v;save();showSettings();};sel2.appendChild(b);});
  row('Night summary card','auto: nightly for 15 days, then weekly',sel2);

document.addEventListener('pointerdown',()=>{if(!AC){ac();preloadMusic();setTimeout(updateMusic,50);}},{capture:true});
$('menuBtn').onclick=()=>{ac();if(uiModal==='menu'){uiModal=null;$('modal').hidden=true;render();}else showMenu();};
function renderModal(){
  const m=$('modal');if(!S){showTitle();return;}if(uiModal==='title'){showTitle();return;}if(uiModal==='menu'){showMenu();return;}if(uiModal==='settings'){showSettings();return;}if(uiModal==='credits'){showCredits();return;}if(uiModal==='trophies'){showTrophies();return;}if(uiModal==='rename'){if(S.renaming)showRename(S.renaming.kind,S.renaming.id);else{uiModal=null;}return;}
  if(!S.alerts.length&&!S.over){m.hidden=true;return;}m.hidden=false;m.innerHTML='';
  if(S.over&&!S.alerts.length){const box=el('div','box bad',`<h3>THE BASE IS OVERRUN</h3><p>Day ${S.day} on ${M().name}. ${M().keep?'Research carries over.':'Nothing carries over on Animalgeddon.'}</p>`);box.appendChild(btn('Title screen','',()=>{confirmMode=null;showTitle();},'go'));m.appendChild(box);return;}
  const a=S.alerts[0];const box=el('div','box '+(a.cls||''),`<h3>${a.title}</h3><p>${a.body}</p>`);
  if(a.choices){const r=el('div','row');a.choices.forEach((c,i)=>{const b=btn(c.label,c.sub||'',()=>{ac();choose(a,i);},i===0?'go':'');if(c.ok===false)b.disabled=true;r.appendChild(b);});box.appendChild(r);m.appendChild(box);return;}
  const r=el('div','row');r.appendChild(btn(S.alerts.length>1?`Next (${S.alerts.length-1} more)`:'Resume ▶','',()=>{ac();S.alerts.shift();if(!S.alerts.length&&!S.over)setSpeed(1);save();render();},'go'));
  if(S.alerts.length>1)r.appendChild(btn('Dismiss all','',()=>{ac();S.alerts=[];if(!S.over)setSpeed(1);save();render();}));
  if(S.battle||a.title==='Herd sighted')r.appendChild(btn('Go to Walls panel','',()=>{ac();S.alerts.shift();openTab('walls');save();render();}));
  box.appendChild(r);m.appendChild(box);
}
function render(){if(S&&S.tut)renderTut();
  updateMusic();renderHud();if(S){const [tag,msg]=advice();const ad=$('advisor');ad.hidden=false;ad.innerHTML=`<b>${tag}</b><span>${msg}</span>`;ad.classList.toggle('fight',!!S.battle);}
  renderModal();renderDrawer();renderBar();updateTip();
}
function updateTip(){
  const tp=$('tip');if(!S)return;if(drag&&drag.moved&&drag.creature){tp.hidden=false;tp.textContent=`Drop ${SPECIES[drag.creature.sp].name} on a wall to post it, or on the pen to rest it`;return;}
  if(!hoverTile){tp.textContent=buildSel?`Placing ${BUILD[buildSel].name}: click an empty tile inside the walls`:'';tp.hidden=!tp.textContent;return;}
  tp.hidden=false;const {x,y}=hoverTile;const t=tileAt(x,y);
  if(!isOpen(x,y)){tp.textContent=isSector(x,y)?(Object.keys(CORNERS).some(c=>{const r=SECTOR[c];return x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1;})?'Forest corner. It opens on its own once both neighbouring sectors are cleared.':'Forest. Clear this sector (Build panel) to use it.'):'The forest beyond the walls. Scouts go out here; hordes come in from here.';return;}
  if(t){const b=BUILD[t.type];const q=S.queue.find(q=>q.key===K(x,y)&&q.kind==='tile');tp.textContent=`${b.name} L${t.lvl}${t.done?'':` · blueprint ${q?fl(q.bp):0}/${b.lv[0].bp}`}${t.done&&b.job?` · ${inJob(b.job).map(p=>p.name).join(', ')||'nobody working'}`:''} · click to manage`;}
  else tp.textContent=buildSel?`Place ${BUILD[buildSel].name} here (${costStr(BUILD[buildSel].lv[0].cost)})`:'Open ground';
}

/* ---------- save ---------- */
function save(){try{if(S)localStorage.setItem('animalgeddon-v12',JSON.stringify(S));localStorage.setItem('animalgeddon-muted',muted?'1':'0');localStorage.setItem('animalgeddon-cfg',JSON.stringify(CFG));}catch(e){}}
function loadCfg(){try{const c=JSON.parse(localStorage.getItem('animalgeddon-cfg'));if(c)Object.assign(CFG,c);}catch(e){}}
function migrate(s){s.speed=0;s.people.forEach(p=>{if(p.age>=ADULT_DAYS&&!p.job)p.job='builder';if(!p.look||p.look.outfit==null)p.look=newLook(p.name);});Object.values(s.tiles).forEach(t=>{if(!t.lvl)t.lvl=1;});s.breed=s.breed||{};s.perks=s.perks||[];s.tut=s.tut||{on:false,step:0};s.stats=s.stats||{kills:0,born:0,hatched:0,crafted:0,gapHeld:0,seen:[]};s.creatures.forEach(c=>{if(!s.stats.seen.includes(c.sp))s.stats.seen.push(c.sp);});s.deferred=s.deferred||[];s.res.hide=s.res.hide||0;s.res.bone=s.res.bone||0;s.gear=s.gear||{};s.craft=s.craft||[];s.done=(s.done||[]).map(d=>d==='monitor'||d==='venom'?'tier2':d==='hawk'?'tier3':d);s.creatures.forEach(c=>{if(c.sp==='monitor')c.sp='komodo';if(!SPECIES[c.sp])c.sp='iguana';if(!c.name)c.name=pick(ANAMES);if(!c.gear)c.gear={armor:null,weapon:null};});Object.values(s.walls).forEach(w=>{if(w.broken==null)w.broken=false;});s.milestones=s.milestones||[];s.graves=s.graves||[];s.weather=s.weather||'clear';s.ev=s.ev||{};if(s.done.includes('cobra')||s.done.includes('dartfrog'))s.done.push('venom');S=s;openCorners();s.done=s.done.filter(id=>RESEARCH.some(r=>r.id===id)).filter((v,i,a)=>a.indexOf(v)===i);return s;}
async function exportSave(){if(!S)return;const name=`animalgeddon-day${S.day}-${S.mode}.json`;const data=JSON.stringify(S);
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data});floater(cv.width/2,cv.height/2,'save downloaded','#8fd45c');}catch(e){if(e&&e.code!=='declined')floater(cv.width/2,cv.height/2,'download unavailable here','#ff6b5c');}return;}
  try{const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch(e){}}
function importSave(file){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!(s&&s.tiles&&s.walls&&s.people&&s.mode))throw 0;for(const k in anim)delete anim[k];S=migrate(s);S.alerts=[];uiModal=null;save();render();log('Save file loaded.','s');}catch(e){alert('That file is not an Animalgeddon save.');}};r.readAsText(file);}
function load(){try{muted=localStorage.getItem('animalgeddon-muted')==='1';const s=JSON.parse(localStorage.getItem('animalgeddon-v12'));if(s&&s.tiles&&s.walls&&s.people&&s.alerts&&s.mode)return s;}catch(e){}return null;}

[0,1,2,4].forEach(n=>$('sp'+n).onclick=()=>{ac();if(!S||uiModal||(n>0&&S.alerts.length))return;setSpeed(n);});
$('mute').onclick=()=>{muted=!muted;ac();renderHud();save();updateMusic();};
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,button'))return;if(!S)return;ac();
  if(e.key==='Escape'){if(uiModal==='menu'||uiModal==='settings'||uiModal==='credits'||uiModal==='trophies'){uiModal=null;$('modal').hidden=true;render();}else if(uiModal==='title'){}else if(buildSel){buildSel=null;render();}else if(tab)closeDrawer();else showMenu();return;}
  if(uiModal)return;
  if(e.key===' '){e.preventDefault();if(S.alerts.length)return;setSpeed(S.speed?0:1);}
  if(e.key==='0'){cam.uz=1;cam.ux=0;cam.uy=0;}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&cam.uz>1){e.preventDefault();const s=40;cam.ux+=e.key==='ArrowLeft'?s:e.key==='ArrowRight'?-s:0;cam.uy+=e.key==='ArrowUp'?s:e.key==='ArrowDown'?-s:0;clampCam();}
  if(e.key==='+'||e.key==='='){cam.uz=Math.min(3,cam.uz*1.25);cam.ux=cv.width/2-(cv.width/2-cam.ux)/ (cam.uz/1.25)*cam.uz;cam.uy=cv.height/2-(cv.height/2-cam.uy)/(cam.uz/1.25)*cam.uz;clampCam();}
  if(e.key==='-'){const nz=Math.max(1,cam.uz/1.25);if(nz<=1.001){cam.uz=1;cam.ux=0;cam.uy=0;}else{cam.ux=cv.width/2-(cv.width/2-cam.ux)/cam.uz*nz;cam.uy=cv.height/2-(cv.height/2-cam.uy)/cam.uz*nz;cam.uz=nz;clampCam();}}
  if(e.key==='1')setSpeed(1);if(e.key==='2')setSpeed(2);if(e.key==='3')setSpeed(4);
  if(e.key==='m'||e.key==='M'){muted=!muted;renderHud();save();updateMusic();}
});

loadCfg();

else{showTitle();}
